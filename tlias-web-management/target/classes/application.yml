server:
  port: 8080            # 端口，按需修改

spring:
  application:
    name: tlias-web-management

  # ----- 数据库连接-----
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/tlias
    username: root
    password: 123456
  servlet:
    multipart:
      #最大请求大小(包括所有文件和表单数据)
      max-request-size: 100MB
      #最大单个文件大小
      max-file-size: 10MB

# ----- MyBatis 配置 -----
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 控制台打印 SQL，调试用
    map-underscore-to-camel-case: true  #开启驼峰命名映射开关

logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: maomaolike
    region: cn-beijing